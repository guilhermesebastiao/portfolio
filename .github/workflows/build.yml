name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || 'GA_ID_PLACEHOLDER' }}
      NEXT_PUBLIC_EMAILJS_SERVICE_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_KEY || 'SERVICE_KEY_PLACEHOLDER' }}
      NEXT_PUBLIC_EMAILJS_TEMPLATE_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_TEMPLATE_KEY || 'TEMPLATE_KEY_PLACEHOLDER' }}
      NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY || 'PUBLIC_KEY_PLACEHOLDER' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build
